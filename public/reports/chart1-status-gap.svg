<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#ffffff"/><text x="60" y="80" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800" fill="#1e293b">The AI status-page gap</text><text x="60" y="125" font-family="Inter,Arial,sans-serif" font-size="26" fill="#94a3b8">Of 817 AI services monitored by DownForAI, how many expose a verified status feed</text><rect x="60" y="200" width="172" height="120" fill="#4F46E5" rx="8"/><rect x="232" y="200" width="908" height="120" fill="#e2e8f0" rx="8"/><text x="146.0" y="272.0" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">16%</text><text x="686.0" y="272.0" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800" fill="#1e293b" text-anchor="middle">84%</text><rect x="60" y="370" width="24" height="24" fill="#4F46E5" rx="4"/><text x="94" y="389" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600" fill="#1e293b">134 services — verified official status feed</text><rect x="60" y="412" width="24" height="24" fill="#e2e8f0" rx="4"/><text x="94" y="431" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600" fill="#1e293b">683 services — no verified public status feed</text><text x="60" y="540" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#1e293b">Only <tspan fill="#4F46E5">1 in 6</tspan> AI services can be independently status-checked.</text><text x="60" y="635" font-family="Inter,Arial,sans-serif" font-size="22" fill="#94a3b8">Source: DownForAI — State of AI Reliability, Q2 2026  ·  downforai.com  ·  CC BY 4.0</text></svg>